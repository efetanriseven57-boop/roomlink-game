kind = "mobile"
previewPath = "/"
title = "Room-Link Puzzle: Galaxy"
version = "1.0.0"
id = "artifacts/roomlink-game"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20025

[services.development]
run = "pnpm --filter @workspace/roomlink-game run dev"

[services.production]
run = [ "pnpm", "--filter", "@workspace/roomlink-game", "run", "serve" ]

[services.env]
PORT = "20025"
BASE_PATH = "/"
