<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1024px; height: 500px; overflow: hidden;
  background: #050010;
  font-family: Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.stars {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle, #ffffff 1px, transparent 1px),
    radial-gradient(circle, #aaaaff 1px, transparent 1px),
    radial-gradient(circle, #ffffff 1px, transparent 1px);
  background-size: 150px 150px, 200px 200px, 300px 300px;
  background-position: 10px 20px, 80px 60px, 30px 100px;
  opacity: 0.6;
}
.nebula {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 20% 50%, rgba(100,0,200,0.3) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 30%, rgba(0,100,200,0.25) 0%, transparent 50%),
              radial-gradient(ellipse at 60% 80%, rgba(200,0,100,0.2) 0%, transparent 40%);
}
.content {
  position: relative; z-index: 10;
  display: flex; align-items: center; gap: 48px;
  padding: 40px;
}
.icon {
  width: 160px; height: 160px;
  border-radius: 36px;
  background: linear-gradient(135deg, #1a0050, #0a0030);
  border: 3px solid #00ff88;
  box-shadow: 0 0 40px rgba(0,255,136,0.6), 0 0 80px rgba(0,255,136,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
  flex-shrink: 0;
}
.title {
  font-size: 72px; font-weight: 900;
  color: #00ff88;
  text-shadow: 0 0 20px rgba(0,255,136,0.8);
  line-height: 1; letter-spacing: -2px;
}
.title2 {
  font-size: 72px; font-weight: 900;
  color: #8844ff;
  text-shadow: 0 0 20px rgba(136,68,255,0.8);
  line-height: 1; letter-spacing: -2px;
}
.subtitle {
  font-size: 24px; color: #88aaff;
  margin-top: 12px;
  text-shadow: 0 0 10px rgba(100,150,255,0.6);
}
.tagline { font-size: 17px; color: #999; margin-top: 14px; }
.flags { font-size: 26px; margin-top: 10px; letter-spacing: 8px; }
.glow-line {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, #00ff88, #8844ff, #00ff88, transparent);
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="nebula"></div>
<div class="content">
  <div class="icon">🌌</div>
  <div>
    <div class="title">Room-Link</div>
    <div class="title2">Puzzle</div>
    <div class="subtitle">✦ Galaxy Edition ✦</div>
    <div class="tagline">Galaksiler arası bağlantı bulmacası</div>
    <div class="flags">🇹🇷 🇬🇧 🇩🇪 🇫🇷 🇮🇹</div>
  </div>
</div>
<div class="glow-line"></div>
</body>
</html>
